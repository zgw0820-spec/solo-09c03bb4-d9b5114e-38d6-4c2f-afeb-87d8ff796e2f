<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}冷库超温告警历史库重建{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
           background: #f4f6f8; color: #1f2933; line-height: 1.55; }
    header { background: #0f3d5c; color: #fff; padding: 14px 24px; }
    header a { color: #cfe6f5; text-decoration: none; margin-right: 18px; }
    header a:hover { text-decoration: underline; }
    header strong { margin-right: 26px; font-size: 1.05rem; }
    main { max-width: 1120px; margin: 24px auto; padding: 0 18px 60px; }
    h1 { font-size: 1.4rem; margin: 0 0 14px; }
    h2 { font-size: 1.1rem; margin: 26px 0 10px; }
    .card { background: #fff; border: 1px solid #dce3ea; border-radius: 8px;
            padding: 18px 20px; margin-bottom: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
    input[type=text], input[type=file], input[type=datetime-local], input[type=month], select {
      width: 100%; padding: 8px 10px; border: 1px solid #b9c4cf; border-radius: 6px; font: inherit;
    }
    button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #0f3d5c;
             background: #0f3d5c; color: #fff; cursor: pointer; }
    button:hover { background: #14547d; }
    button.secondary { background: #fff; color: #0f3d5c; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid #e7ecf1; vertical-align: top; }
    th { background: #f0f4f7; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
    .badge.staged { background: #fff4d6; color: #8a5a00; }
    .badge.attached { background: #dcf5e4; color: #17663a; }
    .badge.rejected { background: #fde2e1; color: #a3251d; }
    .badge.superseded { background: #e6e8eb; color: #4d5862; }
    .badge.late { background: #e3efff; color: #1b4f8a; }
    .badge.history { background: #ece4ff; color: #4b2b8a; }
    .notice { padding: 12px 14px; border-radius: 6px; margin: 12px 0; }
    .notice.ok { background: #dcf5e4; color: #17663a; border: 1px solid #a9dfba; }
    .notice.warn { background: #fff4d6; color: #7a5000; border: 1px solid #f0d38a; }
    .notice.err { background: #fde2e1; color: #a3251d; border: 1px solid #f3b3ae; }
    .muted { color: #64727f; font-size: .86rem; }
    code { background: #eef2f5; padding: 1px 5px; border-radius: 4px; }
    .actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
    .scroll { overflow-x: auto; }
  </style>
</head>
<body>
<header>
  <strong>冷库超温告警历史库</strong>
  <a href="/">总览</a>
  <a href="/late">补报告警</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
